name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release (e.g. v1.0.26 — bare 1.0.26 works too)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Resolve release tag
        id: resolve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Accept "1.0.26" or "v1.0.26".
            TAG="v${INPUT_TAG#v}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::'$INPUT_TAG' is not a version tag (expected e.g. v1.0.26)"
              exit 1
            fi
            # The tag must already be pushed: `gh release create` on an
            # unknown tag silently creates it at the default-branch HEAD
            # (which is how a stray `main` tag once appeared).
            if ! gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::tag $TAG does not exist on ${{ github.repository }} — push it first"
              exit 1
            fi
          else
            TAG="$PUSHED_TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "releasing $TAG"

      - name: Create or reuse release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" \
               --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG already exists; reusing"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Atlas $TAG" \
            --notes "See CHANGELOG.md for release notes."

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.args }}
    needs: create-release
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-target: aarch64-apple-darwin
            updater-key: darwin-aarch64
            bundle-dir: src-tauri/target/aarch64-apple-darwin/release/bundle/macos
            bundle-pattern: "*.app.tar.gz"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-target: x86_64-apple-darwin
            updater-key: darwin-x86_64
            bundle-dir: src-tauri/target/x86_64-apple-darwin/release/bundle/macos
            bundle-pattern: "*.app.tar.gz"
          - platform: ubuntu-22.04
            args: ""
            rust-target: ""
            updater-key: linux-x86_64
            bundle-dir: src-tauri/target/release/bundle/appimage
            bundle-pattern: "*.AppImage"
          - platform: windows-latest
            args: ""
            rust-target: ""
            updater-key: windows-x86_64
            bundle-dir: src-tauri/target/release/bundle/nsis
            bundle-pattern: "*-setup.exe"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          # On workflow_dispatch this is the input tag, so the build uses
          # the tagged commit rather than the branch tip.
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libgtk-3-dev \
            libssl-dev

      - name: Import Apple Developer cert
        if: startsWith(matrix.platform, 'macos')
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        # Tauri 2 auto-signs the updater bundles when
        # `TAURI_SIGNING_PRIVATE_KEY` is set, and auto-notarises the
        # macOS bundle when `APPLE_ID` + `APPLE_PASSWORD` + `APPLE_TEAM_ID`
        # are set. The signed `<bundle>.sig` files land in the same
        # directory as the bundles.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          pnpm tauri build ${{ matrix.args }}

      - name: Stage updater bundle + signature
        id: updater
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE=$(find "${{ matrix.bundle-dir }}" -maxdepth 1 \
                       -name "${{ matrix.bundle-pattern }}" ! -name "*.sig" \
                   | head -n 1 || true)
          if [ -z "$BUNDLE" ] || [ ! -f "$BUNDLE" ]; then
            echo "::error::No updater bundle matching ${{ matrix.bundle-pattern }} in ${{ matrix.bundle-dir }}"
            exit 1
          fi
          SIG="${BUNDLE}.sig"
          if [ ! -f "$SIG" ]; then
            echo "::error::No .sig next to $BUNDLE — TAURI_SIGNING_PRIVATE_KEY didn't take effect"
            exit 1
          fi

          # Stable upload name keyed on platform so re-runs overwrite
          # the previous asset cleanly.
          UPLOAD_NAME="${{ matrix.updater-key }}-$(basename "$BUNDLE")"
          STAGED_BUNDLE="$RUNNER_TEMP/$UPLOAD_NAME"
          STAGED_SIG="$RUNNER_TEMP/$UPLOAD_NAME.sig"
          cp "$BUNDLE" "$STAGED_BUNDLE"
          cp "$SIG" "$STAGED_SIG"

          {
            echo "bundle=$STAGED_BUNDLE"
            echo "sig=$STAGED_SIG"
          } >> "$GITHUB_OUTPUT"

      - name: Upload bundles + signature
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail

          # Collect every user-facing bundle that tauri build produced
          # (.dmg, .deb, .AppImage, .msi, etc.) plus the staged updater
          # tarball + sig.
          ASSETS=()
          while IFS= read -r f; do
            ASSETS+=("$f")
          done < <(find src-tauri/target -type f \
            \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \
               -o -name "*.msi" -o -name "*-setup.exe" \) 2>/dev/null)

          ASSETS+=("${{ steps.updater.outputs.bundle }}")
          ASSETS+=("${{ steps.updater.outputs.sig }}")

          gh release upload "$TAG" "${ASSETS[@]}" \
            --clobber \
            --repo "${{ github.repository }}"

  manifest:
    name: Build & upload latest.json
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Assemble manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          WORK=$(mktemp -d)
          cd "$WORK"

          gh release download "$TAG" --repo "$REPO" --pattern "*.sig"

          VERSION="${TAG#v}"
          PUBDATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          PLATFORMS_JSON="{}"
          for KEY in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            SIG_FILE=$(ls "${KEY}-"*.sig 2>/dev/null | head -n 1 || true)
            if [ -z "$SIG_FILE" ]; then
              echo "no sig for $KEY — skipping"
              continue
            fi
            BUNDLE_NAME="${SIG_FILE%.sig}"
            URL="https://github.com/$REPO/releases/download/$TAG/$BUNDLE_NAME"
            SIG=$(cat "$SIG_FILE")
            PLATFORMS_JSON=$(jq \
              --arg key "$KEY" \
              --arg sig "$SIG" \
              --arg url "$URL" \
              '. + {($key): {signature: $sig, url: $url}}' \
              <<<"$PLATFORMS_JSON")
          done

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUBDATE" \
            --argjson platforms "$PLATFORMS_JSON" \
            '{
              version: $version,
              notes: "See CHANGELOG.md",
              pub_date: $pub_date,
              platforms: $platforms
            }' > latest.json

          cat latest.json
          gh release upload "$TAG" latest.json \
            --clobber --repo "$REPO"
