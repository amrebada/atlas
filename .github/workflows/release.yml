name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.args }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon — native build on M-series runner.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-target: aarch64-apple-darwin
          # Intel macs — cross-compiled from M-series runner. Avoids
          # GitHub's throttled `macos-13` queue (Intel runners are
          # being deprecated). Apple Silicon → x86_64-apple-darwin
          # is a first-class Rust target; tauri build supports it.
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-target: ""
          - platform: windows-latest
            args: ""
            rust-target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # Per-arch macOS builds need separate caches so they don't
          # clobber each other on shared runners.
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libgtk-3-dev \
            libssl-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload Tauri bundle
        # Pinned. The floating `@v0` had a bug where the macOS
        # `.app.tar.gz.sig` got orphaned because the action re-tarred
        # `.app` into a freshly-named bundle. Pin to a recent release
        # that uses the existing tarball + sig pair.
        uses: tauri-apps/tauri-action@action-v0.5.21
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Tauri update keypair — REQUIRED for auto-update.
          # Without these, tauri-action skips the .sig + latest.json
          # artefacts and the updater URL stays 404.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # macOS Developer ID + notarisation.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # No Windows code signing — Authenticode is intentionally not
          # configured. Auto-update still works; SmartScreen warns once
          # per install.

        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Atlas ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for release notes."
          # Publish immediately so `releases/latest/download/latest.json`
          # resolves without manual intervention.
          releaseDraft: false
          prerelease: false
          # Make tauri-action upload the `.nsis.zip` updater bundle
          # alongside the `.msi` on Windows. Without this it only
          # uploads the `.msi` and the Windows entry is missing from
          # `latest.json`.
          updaterJsonPreferNsis: true
          # Keep the per-arch entries on macOS so the manifest emits
          # `darwin-aarch64` + `darwin-x86_64` keys (matching what
          # `plugin-updater` looks up at runtime).
          updaterJsonKeepUniversal: false
          args: ${{ matrix.args }}
