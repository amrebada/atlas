[package]
name = "atlas"
version = "1.0.20"
description = "Desktop-native command hub for local git projects"
authors = ["Amr Ebada"]
license = "MIT"
repository = "https://github.com/amrebada/atlas"
edition = "2021"
# Disambiguate `cargo run` now that the crate ships two bins: the main
# Tauri app (auto-inferred from `src/main.rs` → `atlas`) and
# `perf-check` below. Without this, `pnpm tauri dev` (which shells
# out to `cargo run`) fails with "could not determine which binary to
# run".
default-run = "atlas"

[lib]
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Dev-only perf regression tool. Gated behind the `perf-tools` feature
# so the release build doesn't try to bundle it alongside the Tauri app.
# Run with: `cargo run --features perf-tools --bin perf-check`.
[[bin]]
name = "perf-check"
path = "tools/perf_check.rs"
required-features = ["perf-tools"]

[features]
default = []
perf-tools = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core + plugins
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-decorum = "1"
tauri-plugin-autostart = "2"

# Serde / JSON / YAML
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"                       # Taskfile.yml parser (script discovery)

# Async runtime
tokio = { version = "1", features = ["full"] }

# SQLite (D1)
sqlx = { version = "0.8", features = [
    "sqlite",
    "runtime-tokio-rustls",
    "macros",
    "migrate",
    "chrono",
] }

# Synchronous SQLite read access for third-party tool databases (e.g.
# OpenCode CLI's `~/.local/share/opencode/opencode.db`). `bundled` ships a
# matching libsqlite so the build doesn't depend on whatever sqlite version
# is installed on the host.
rusqlite = { version = "0.32", features = ["bundled"] }

# Filesystem watching (P2)
notify = "6"
notify-debouncer-full = "0.3"

# Git (P2)
git2 = { version = "0.19", default-features = false, features = [] }

# PTY (P6)
portable-pty = "0.8"

# Directory traversal respecting .gitignore (P2/D2)
ignore = "0.4"

# Parallelism
rayon = "1"

# Safe file deletion — moves items to the platform trash (macOS "Move to Trash",
# Linux XDG trash, Windows Recycle Bin) instead of an irreversible unlink.
trash = "5"

# Cross-platform system info — home-volume disk free/total for the sidebar's
# "24.3 / 500 GB" row. Disks-only feature-set keeps the dep tiny (no CPU,
# process, memory, network info pulled in). macOS requires no entitlement
# for the Disks API.
sysinfo = { version = "0.38", default-features = false, features = ["disk"] }

# Errors
anyhow = "1"
thiserror = "1"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time / IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# TS type generation (D1 uses this)
ts-rs = "10"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

# Embedded HTTP server for the MCP endpoint (remote-control feature).
# Loopback only, env-var gated; default-off so Atlas behavior is unchanged.
axum = "0.8"

# Base64 encoding for MCP image content (screenshots etc).
base64 = "0.22"

# Outbound WebSocket client for the atlas-agent (Phase 4 — pipes commands
# from the relay backend into the local MCP server). Default-off; only
# starts when ATLAS_AGENT_ENABLED=1.
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# HTTP client for the agent → loopback MCP server hop. Already pulled in
# transitively by tauri-plugin-updater; this just makes the dep explicit.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Device-pairing keypair for atlas-agent (Phase 4.0c). 32-byte ed25519
# private key persisted to $APP_DATA/atlas/agent_key with 0600 perms.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"
